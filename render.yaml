services:
  - type: web
    name: medicheck-mx-api-v47
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_MODELS
        value: gemini-3.8-flash,gemini-3.5-flash-lite,gemini-2.5-flash
      - key: COFEPRIS_YEARS
        value: 2026
      - key: AUTO_SYNC
        value: "1"
      - key: AUTO_SYNC_HOURS
        value: "24"
