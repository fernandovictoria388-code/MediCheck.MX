services:
  - type: web
    name: medicheck-mx-api
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: COFEPRIS_YEARS
        value: 2026
      - key: AUTO_SYNC
        value: "0"

# Consulta individual en tiempo real usando Gemini + Google Search, restringida a fuentes COFEPRIS.
COFEPRIS_LIVE_SEARCH=1
