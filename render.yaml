services:
  - type: web
    name: medicheck-mx-api-v49
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: COFEPRIS_YEARS
        value: 2026
      - key: COFEPRIS_STATUS_YEARS
        value: 2022,2023,2024,2025,2026
      - key: AUTO_SYNC
        value: "1"
      - key: AUTO_SYNC_HOURS
        value: "24"
